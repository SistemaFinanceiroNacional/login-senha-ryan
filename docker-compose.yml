# Credentials come from the environment (see .env.example); nothing secret
# is versioned. PostgreSQL is only reachable from this machine.
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - default

  yoyo-rollback:
    image: yoyo:1.0
    build:
      context: .
      dockerfile: ./Dockerfile.yoyo
    command: >-
      --no-config-file rollback --all
      --database postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      /yoyo/sql
    volumes:
      - ./migrations:/yoyo/sql
    depends_on:
      - db
    networks:
      - default

  yoyo-up:
    image: yoyo:1.0
    build:
      context: .
      dockerfile: ./Dockerfile.yoyo
    command: >-
      --no-config-file apply
      --database postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      /yoyo/sql
    volumes:
      - ./migrations:/yoyo/sql
    depends_on:
      - db
    networks:
      - default

networks:
  default:
