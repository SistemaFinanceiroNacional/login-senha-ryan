{% extends "base.html" %}
{% block page %}page-register{% endblock %}
{% block content %}
    <section class="area-register">
        <div class="register">
            <div>
                <img src="/static/logo.png" alt="">
            </div>
            <form id="sign-up" data-passkey="sign-up">
                <input type="text" name="login" placeholder="Username" autocomplete="username"
                       autofocus required aria-required="true" maxlength="64"/>
                <input type="submit" value="Open account with a passkey"/>
            </form>
            <p id="message" role="alert"></p>
            <p>Your passkey can be this device (fingerprint, face, PIN) or a security key.</p>
        </div>
    </section>
    <script src="/static/passkeys.js" defer></script>
{% endblock %}
