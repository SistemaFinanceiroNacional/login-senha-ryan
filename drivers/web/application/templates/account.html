{% extends "base.html" %}
{% block style %}
    .account{
        padding: 100px 7% 0;
        color: #F0F0F0;
    }
{% endblock %}
{% block content %}
<section class="account">
    balance: {{ balance }}
    <ol>
        {% for t in transactions %}
            <li>{{ t }}</li>
        {% endfor %}
    </ol>
</section>
{% endblock %}
